# Builds Nodeboard.app as a universal (Apple Silicon + Intel) .dmg and attaches
# it to a GitHub Release named after the version in src-tauri/tauri.conf.json.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: Nodeboard v__VERSION__
          releaseBody: |
            Download the .dmg, open it and drag Nodeboard to Applications.
            The app is not signed by Apple: on first launch, if macOS refuses to open it, go to System Settings → Privacy & Security → "Open Anyway".
          releaseDraft: false
          prerelease: false
