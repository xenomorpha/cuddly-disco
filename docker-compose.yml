# docker compose up  ->  Postgres 17 + the API on http://localhost:3000 (docs at /docs)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodeboard
      POSTGRES_PASSWORD: nodeboard
      POSTGRES_DB: nodeboard
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeboard -d nodeboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://nodeboard:nodeboard@postgres:5432/nodeboard
      SEED_DEMO: "1" # loads the demo workspace and dev tokens on first start
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
